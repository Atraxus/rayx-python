name: Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

# Cancel superseded runs on PRs; never cancel runs on main or tags, so every
# push to main refreshes the nightly release and every tag gets published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The manylinux build image (Dockerfile) lives in this repository's GHCR
  # namespace, tagged by a hash of the Dockerfile. On pushes it is built and
  # published when that tag does not exist yet, so a Dockerfile change takes
  # effect in the same run and every fork bootstraps its own image. PRs never
  # publish; build_wheels builds a missing image locally instead.
  image:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      exists: ${{ steps.ref.outputs.exists }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Resolve image reference
        id: ref
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/manylinux_cuda"
          tag="$(sha256sum Dockerfile | cut -c1-16)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "ref=$image:$tag" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$image:$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: github.event_name == 'push' && steps.ref.outputs.exists == 'false'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build and push image
        if: github.event_name == 'push' && steps.ref.outputs.exists == 'false'
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${{ steps.ref.outputs.ref }}" -t "${{ steps.ref.outputs.image }}:latest" .
          docker push "${{ steps.ref.outputs.ref }}"
          docker push "${{ steps.ref.outputs.image }}:latest"

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: image
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        os: [ubuntu-latest]
    env:
      CIBW_MANYLINUX_X86_64_IMAGE: ${{ needs.image.outputs.ref }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          # setuptools-scm derives the version from tags and commit distance.
          fetch-depth: 0
          fetch-tags: true

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # PRs that change the Dockerfile have no published image yet.
      - name: Build image locally
        if: needs.image.outputs.exists == 'false' && github.event_name != 'push'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker build -t "$CIBW_MANYLINUX_X86_64_IMAGE" .

      - name: Build wheels
        uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        with:
          output-dir: dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./dist/*.whl
          if-no-files-found: error

  # Release builds: tags only, published together once every build has passed.
  # The PyPI Trusted Publisher only trusts the upstream repository, so skip
  # (rather than fail) this job on forks.
  publish_pypi:
    name: Publish to PyPI
    needs: build_wheels
    if: >-
      github.repository == 'hz-b/rayx-python'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rayx/
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true

  # Development builds: every push to main replaces the assets of the rolling
  # "nightly" GitHub pre-release. The tag name must not contain a digit, so
  # setuptools-scm (which only considers tags matching *[0-9]*) ignores it.
  # This also runs on forks, giving each fork a nightly of its own main.
  publish_nightly:
    name: Update nightly release
    needs: build_wheels
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: nightly

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Move nightly tag to this commit
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true --silent
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          fi

      - name: Replace release assets
        run: |
          notes="Development build of main at ${GITHUB_SHA}. Not a stable release.

          Install with: pip install <wheel URL from the assets below>"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --notes "$notes"
            # Wheel filenames change with every commit (X.Y.Z.devN), so drop
            # the previous build's assets rather than accumulating them.
            gh release view "$TAG" --json assets --jq '.assets[].name' |
              while read -r asset; do
                gh release delete-asset "$TAG" "$asset" --yes
              done
          else
            gh release create "$TAG" --prerelease --title "Nightly (main)" \
              --notes "$notes" --verify-tag
          fi
          gh release upload "$TAG" dist/*.whl
